name: Build SAP BTP MTA Archive

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build MTA Archive (.mtar)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm install

      - name: Install Cloud MTA Build Tool (mbt)
        run: npm install -g mbt

      - name: Build Cloud Foundry MTA Archive
        run: |
          npm run build:cf
          mbt build -t ./mta_archives

      - name: Upload .mtar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: credit-guard-mtar
          path: mta_archives/*.mtar
          retention-days: 7

  test:
    name: Unit tests (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm install

      - name: Run Test Suite
        run: npm test